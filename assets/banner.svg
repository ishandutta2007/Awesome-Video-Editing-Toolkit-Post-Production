<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Vibrant Gradient Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Cyan to Purple Glow -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="clip1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="clip2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="clip3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
    .code-font {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 11px;
      fill: #38bdf8;
    }
  </style>

  <!-- Deep Workspace Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Animated Decorative Grid & Floating Particles -->
  <g opacity="0.12">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="200" y1="0" x2="200" y2="360" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="400" y1="0" x2="400" y2="360" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="800" y1="0" x2="800" y2="360" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
  </g>

  <!-- Ambient Blurred Glow Spheres -->
  <circle cx="150" cy="80" r="130" fill="#6366f1" opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="190" r="150" fill="#ec4899" opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.14;0.06;0.14" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="300" r="140" fill="#06b6d4" opacity="0.1" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.06;0.16;0.06" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Post-Production NLE Timeline Track at Bottom -->
  <g id="timeline-container" transform="translate(60, 240)">
    <!-- Track header / background panel -->
    <rect x="0" y="0" width="1080" height="82" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />

    <!-- Track 1: Video Track -->
    <rect x="10" y="8" width="1060" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" />
    <!-- Clip A -->
    <rect x="18" y="11" width="180" height="22" rx="4" fill="url(#clip1)" />
    <text x="30" y="26" class="code-font" fill="#bfdbfe">V1: Footage_4K.raw</text>
    <!-- Clip B -->
    <rect x="206" y="11" width="260" height="22" rx="4" fill="url(#clip2)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="218" y="26" class="code-font" fill="#fbcfe8">V2: AI_Neural_VFX.mov</text>
    <!-- Clip C -->
    <rect x="474" y="11" width="220" height="22" rx="4" fill="url(#clip1)" />
    <text x="486" y="26" class="code-font" fill="#bfdbfe">V1: B-Roll_Dynamic.mp4</text>
    <!-- Clip D -->
    <rect x="702" y="11" width="360" height="22" rx="4" fill="url(#clip3)" />
    <text x="714" y="26" class="code-font" fill="#a7f3d0">V3: Auto_Whisper_Captions.srt</text>

    <!-- Track 2: Audio Waveform Track -->
    <rect x="10" y="44" width="1060" height="30" rx="6" fill="#1e293b" fill-opacity="0.7" />
    <!-- Audio Waveform Graphic Simulation -->
    <path d="M 20 59 Q 25 48, 30 59 T 40 59 T 50 49 T 60 69 T 70 52 T 80 66 T 90 59 T 100 48 T 110 70 T 120 59 T 130 50 T 140 68 T 150 59 T 160 52 T 170 66 T 180 59 T 190 49 T 200 69 T 210 59 T 220 51 T 230 67 T 240 59 T 250 48 T 260 70 T 270 59 T 280 53 T 290 65 T 300 59 T 310 49 T 320 69 T 330 59 T 340 50 T 350 68 T 360 59 T 370 52 T 380 66 T 390 59 T 400 49 T 410 69 T 420 59 T 430 51 T 440 67 T 450 59 T 460 48 T 470 70 T 480 59 T 490 53 T 500 65 T 510 59 T 520 49 T 530 69 T 540 59 T 550 50 T 560 68 T 570 59 T 580 52 T 590 66 T 600 59 T 610 49 T 620 69 T 630 59 T 640 51 T 650 67 T 660 59 T 670 48 T 680 70 T 690 59 T 700 53 T 710 65 T 720 59 T 730 49 T 740 69 T 750 59 T 760 50 T 770 68 T 780 59 T 790 52 T 800 66 T 810 59 T 820 49 T 830 69 T 840 59 T 850 51 T 860 67 T 870 59 T 880 48 T 890 70 T 900 59 T 910 53 T 920 65 T 930 59 T 940 49 T 950 69 T 960 59 T 970 50 T 980 68 T 990 59 T 1000 52 T 1010 66 T 1020 59 T 1030 49 T 1040 69 T 1050 59 T 1060 55" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.75" />

    <!-- Animated Playhead Scrubber across timeline -->
    <line x1="0" y1="2" x2="0" y2="80" stroke="#f43f5e" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="x1" values="20;1050;20" dur="12s" repeatCount="indefinite" />
      <animate attributeName="x2" values="20;1050;20" dur="12s" repeatCount="indefinite" />
    </line>
    <polygon points="-6,2 6,2 0,9" fill="#f43f5e" filter="url(#glow)">
      <animate attributeName="transform" type="translate" values="20,0; 1050,0; 20,0" dur="12s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Top Decorative Pill / Category Tag -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="290" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" class="badge-text" fill="#93c5fd">CURATED TOOLKIT &amp; POST-PRODUCTION</text>
  </g>

  <!-- Primary Foreground Title -->
  <!-- Crisp High-Contrast Typography Guaranteed in Foreground -->
  <text x="60" y="118" class="title">
    Awesome Video Editing &amp; Post-Production
  </text>

  <!-- Informative Subtitle -->
  <text x="60" y="152" class="subtitle">
    Curated Hub for Cloud &amp; Desktop NLEs, Transcript Editing, Whisper Captions, Auto-Clipping &amp; Programmatic Post-Production
  </text>

  <!-- Interactive Visual Pills / Category Badges -->
  <g transform="translate(60, 180)">
    <!-- Pill 1: Cloud & Desktop NLEs -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <text x="90" y="21" class="badge-text" text-anchor="middle" fill="#c7d2fe">🎬 Cloud &amp; Desktop NLE</text>
    </g>

    <!-- Pill 2: Transcript & AI Cutting -->
    <g transform="translate(192, 0)">
      <rect width="184" height="34" rx="8" fill="#4a044e" stroke="#c026d3" stroke-width="1.2" />
      <text x="92" y="21" class="badge-text" text-anchor="middle" fill="#f5d0fe">🎙️ Text-Based &amp; Subtitles</text>
    </g>

    <!-- Pill 3: Programmatic & CLI Automation -->
    <g transform="translate(388, 0)">
      <rect width="194" height="34" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1.2" />
      <text x="97" y="21" class="badge-text" text-anchor="middle" fill="#bae6fd">⚡ Programmatic Video / CLI</text>
    </g>

    <!-- Pill 4: Open-Source Powerhouses -->
    <g transform="translate(594, 0)">
      <rect width="170" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
      <text x="85" y="21" class="badge-text" text-anchor="middle" fill="#a7f3d0">🌟 200k+ Stars Ecosystem</text>
    </g>
  </g>

  <!-- Right Decorative Icon Symbol (Film Reel + Scissors / Waveform) -->
  <g transform="translate(1030, 95)" filter="url(#glow)">
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="14 6">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="20s" repeatCount="indefinite" />
    </circle>
    <!-- Play symbol in center -->
    <polygon points="44,35 66,50 44,65" fill="url(#accentGrad)" />
  </g>
</svg>
